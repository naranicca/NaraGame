name: Platform players

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NaraGamePlayer-android-debug
          path: platform/android/app/build/outputs/apk/debug/*.apk

  apple:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [macos, ios]
    steps:
      - uses: actions/checkout@v4
      - name: Configure macOS player
        if: matrix.target == 'macos'
        run: cmake -S platform/apple/macos -B build/apple-macos -G Xcode
      - name: Build macOS player
        if: matrix.target == 'macos'
        run: cmake --build build/apple-macos --config Release
      - name: Configure iOS simulator player
        if: matrix.target == 'ios'
        run: >-
          cmake -S platform/apple/ios -B build/apple-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build iOS simulator player
        if: matrix.target == 'ios'
        run: cmake --build build/apple-ios --config Release -- -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO
